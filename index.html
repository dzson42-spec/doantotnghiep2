<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVite - Hệ Thống Đặt Vé Xem Phim Trực Tuyến</title>
    <meta name="description" content="Hệ thống website bán vé xem phim trực tuyến CineVite - Đặt vé nhanh chóng, chọn ghế thời gian thực, nhận vé điện tử mã QR Code." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; color: #fff; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border: 3px solid rgba(225, 29, 72, 0.2); border-top-color: #e11d48; border-radius: 50%; animation: cinevite-spin 0.8s linear infinite;"></div>
          <svg style="position: absolute; inset: 0; margin: auto; width: 28px; height: 28px; color: #e11d48;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"></path>
          </svg>
        </div>
        <h2 style="font-size: 22px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.5px; color: #f8fafc;">CineVite</h2>
        <p style="font-size: 14px; color: #94a3b8; margin: 0;">Đang khởi động hệ thống đặt vé...</p>
        <style>
          @keyframes cinevite-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
